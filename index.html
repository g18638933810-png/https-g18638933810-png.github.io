    + '<div style="position:relative;margin-top:.75rem"><span style="pointer-events:none;position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:var(--dim);display:inline-flex">'+icon(I.search,17)+'</span>'
    + '<input id="words-search" type="search" class="input" style="padding-left:2.5rem;padding-right:2.5rem" aria-label="搜索词库（单词、读音或释义）" placeholder="搜单词、读音或中文释义…" value="'+esc(u.search)+'">'
    + (u.search ? '<button type="button" id="words-clear" aria-label="清除搜索" class="iconbtn" style="position:absolute;right:.625rem;top:50%;transform:translateY(-50%);width:2rem;height:2rem;background:var(--surface-2);color:var(--dim)">'+icon(I.x,14)+'</button>' : "")
    + '</div>'
    + '<div class="filterrow no-scrollbar" style="margin-top:.75rem">'
    + FILTERS.map(function(f){ return '<button type="button" data-filter="'+f.key+'" aria-pressed="'+(u.filter===f.key)+'" class="'+(u.filter===f.key?"on":"")+'">'+f.label+'</button>'; }).join("")
    + '</div>';
  if(!words.length){
    h += '<div style="padding:3rem 0;text-align:center"><p style="font-size:2.25rem">'+(u.filter==="unknown"?"🎉":"📖")+'</p><p style="margin-top:.75rem;font-size:.875rem;color:var(--dim)">'
      + (q ? "没有找到和「"+esc(u.search.trim())+"」有关的词，换个关键词试试。" : u.filter==="unknown" ? "没有错词，最近答错的词会自动收进这里。" : "这里还空着。生成今日单词，或者去查词页加几个词进来。")
      + '</p></div>';
  } else {
    h += '<ul style="margin-top:.5rem;display:grid;gap:.625rem">'
      + words.map(function(w,idx){
          var open = u.expanded===w.id;
          var detail = "";
          if(open){
            detail = '<div class="anim-rise" style="margin-top:.75rem;border-top:1px solid var(--border);padding-top:.75rem">'
              + (w.exampleJp ? '<p class="mincho" style="font-size:.875rem;line-height:1.65">'+esc(w.exampleJp)+'</p>'+(w.exampleCn?'<p style="margin-top:.125rem;font-size:.875rem;color:var(--dim)">'+esc(w.exampleCn)+'</p>':"") : "")
              + (w.mnemonic ? '<p style="margin-top:.5rem;font-size:.875rem"><span style="font-weight:700;color:var(--gold)">助记 · </span>'+esc(w.mnemonic)+'</p>' : "")
              + (u.regenError ? '<p style="margin-top:.5rem;font-size:.75rem;color:var(--accent)">'+esc(u.regenError)+'</p>' : "")
              + '<p style="margin-top:.5rem;font-size:.75rem;color:var(--dim)">下次复习：'+esc(w.dueDate)+(w.freqRank?" · 词频 "+(FREQ_LABEL[w.freqRank]||""):"")+(w.source==="ai"?" · AI 生成":w.source==="lookup"?" · 查词加入":" · 手动添加")+'</p>'
              + '<div style="margin-top:.625rem;display:flex;flex-wrap:wrap;gap:.5rem">'
              + '<button type="button" data-speak="'+esc(w.word)+'" class="btn" style="gap:.375rem;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;background:var(--surface-2);color:var(--text)">'+icon(I.speaker,15)+' 朗读</button>'
              + (w.mnemonic ? '<button type="button" data-wregen="'+w.id+'" class="btn" style="gap:.375rem;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;background:var(--surface-2);color:var(--text)" '+(u.regenBusy?"disabled":"")+'>'+icon(I.refresh,15)+(u.regenBusy?" 想着呢…":" 换个助记")+'</button>' : "")
              + '<button type="button" data-wdel="'+w.id+'" class="btn" style="gap:.375rem;border-radius:.5rem;padding:.5rem .75rem;font-size:.875rem;font-weight:500;background:var(--surface-2);color:var(--accent)">'+icon(I.trash,15)+' 删除这个词</button>'
              + '</div></div>';
          }
          return '<li class="wordrow anim-slide-up" style="animation-delay:'+(Math.min(idx,12)*45)+'ms"><button type="button" data-wtoggle="'+w.id+'" aria-expanded="'+open+'" aria-label="'+esc(w.word)+' 详情" style="display:flex;width:100%;align-items:center;gap:.75rem;text-align:left;min-height:2.25rem"><span class="mincho" style="font-size:1.25rem;font-weight:600">'+esc(w.word)+'</span><span class="mincho" style="font-size:.875rem;color:var(--dim)">'+esc(w.reading)+'</span>'
            + (w.freqRank===1 ? '<span style="flex-shrink:0;border-radius:9999px;padding:.125rem .5rem;font-size:10px;font-weight:700;color:#fff;background:var(--gold)">高频</span>' : "")
            + '<span style="margin-left:auto;flex-shrink:0">'+boxDots(w.box)+'</span></button>'
            + '<p style="margin-top:.125rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.875rem;color:var(--dim)">'+esc(w.meaning)+'</p>'+detail+'</li>';
        }).join("") + '</ul>';
  }
  h += '</div>';
  view.innerHTML = h;
  var si = document.getElementById("words-search");
  si.addEventListener("input", function(){
    u.search = si.value;
    var pos = si.selectionStart;
    render();
    var nsi = document.getElementById("words-search");
    nsi.focus(); try{ nsi.setSelectionRange(pos,pos); }catch(e){}
  });
  var wc = document.getElementById("words-clear"); if(wc) wc.addEventListener("click", function(){ u.search=""; render(); });
  Array.prototype.forEach.call(view.querySelectorAll("[data-filter]"), function(b){ b.addEventListener("click", function(){ u.filter = b.getAttribute("data-filter"); render(); }); });
  Array.prototype.forEach.call(view.querySelectorAll("[data-wtoggle]"), function(b){ b.addEventListener("click", function(){ var id = parseInt(b.getAttribute("data-wtoggle"),10); u.expanded = u.expanded===id ? null : id; u.regenError = null; render(); }); });
  Array.prototype.forEach.call(view.querySelectorAll("[data-wdel]"), function(b){ b.addEventListener("click", function(){
    var id = parseInt(b.getAttribute("data-wdel"),10);
    DB.words = DB.words.filter(function(w){ return w.id!==id; });
    DB.reviews = DB.reviews.filter(function(r){ return r.wordId!==id; });
    saveDB(); render();
  }); });
  Array.prototype.forEach.call(view.querySelectorAll("[data-wregen]"), function(b){ b.addEventListener("click", function(){
    var id = parseInt(b.getAttribute("data-wregen"),10);
    var w = DB.words.filter(function(x){ return x.id===id; })[0]; if(!w) return;
    u.regenBusy = true; u.regenError = null; render();
    aiMnemonic(w, true).then(function(){ u.regenBusy = false; render(); }).catch(function(e){ u.regenBusy = false; u.regenError = e && e.message ? e.message : "换助记失败，请重试。"; render(); });
  }); });
}
</script>
<script>
"use strict";
/* ---------- settings view ---------- */
var settingsUI = { notice:null, noticeOk:false, backupMsg:null, backupOk:false, busy:false };
var deferredInstallEvt = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstallEvt = e; });
function accentTheme(){ var v = lsGet("vocab-accent"); return ["matcha","sakura","ocean","grape"].indexOf(v)>=0 ? v : "default"; }
function applyAccent(){
  var a = accentTheme();
  if(a==="default") document.documentElement.removeAttribute("data-accent");
  else document.documentElement.setAttribute("data-accent", a);
}
function fontSizePref(){ var v = lsGet("vocab-fontsize"); return (v==="s"||v==="l") ? v : "m"; }
function applyFontSize(){
  var v = fontSizePref();
  document.documentElement.style.fontSize = v==="l" ? "17.5px" : v==="s" ? "15px" : "";
}
function appearance(){ return lsGet("vocab-appearance")==="dark" ? "dark" : "light"; }
function applyAppearance(){
  if(appearance()==="dark") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  var tc = document.querySelector('meta[name="theme-color"][media*="light"]');
  if(tc) tc.setAttribute("content", appearance()==="dark" ? "#0d1220" : "#ffffff");
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
}
function renderSettings(st){
  var u = settingsUI;
  var s = DB.settings;
  var ap = appearance();
  var reminderOn = lsGet("vocab-reminder-enabled")==="1";
  var reminderTime = lsGet("vocab-reminder-time") || "20:00";
  var perm = ("Notification" in window) ? Notification.permission : "unsupported";
  var standalone = isStandalone();
  var h = '<div class="anim-rise"><h2 class="mincho" style="font-size:1.5rem;font-weight:700">设置</h2>';

  /* 添加到桌面 */
  h += '<section id="install-section" style="margin-top:1.25rem;border-radius:1rem;padding:1rem;background:var(--surface);border:1px solid var(--gold)">'
    + '<p style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600"><span style="color:var(--gold);display:inline-flex">'+icon(I.home,17)+'</span> 添加到手机桌面</p>';
  if(standalone){
    h += '<p style="margin-top:.375rem;font-size:.75rem;line-height:1.65;color:var(--jade);font-weight:600">✓ 你已经是从主屏幕打开的了，就是桌面版 App 的样子。</p>';
  } else {
    h += '<p style="margin-top:.375rem;font-size:.75rem;line-height:1.65;color:var(--dim)">把背词卡钉到主屏幕，点图标直接打开，全屏、没有浏览器框，跟原生 App 一样。词库和进度都存在这台手机上。</p>'
      + '<div id="install-action" style="margin-top:.75rem"></div>'
      + '<div class="install-steps" style="margin-top:.75rem">'
      + (isIOS()
        ? '<p><b>iPhone / iPad（Safari）：</b></p><p>1. 点 Safari 底部的「分享」按钮（方框带向上箭头）</p><p>2. 在菜单里选「添加到主屏幕」</p><p>3. 点右上角「添加」，桌面上就会出现「背词卡」图标</p>'
        : '<p><b>安卓（Chrome）：</b></p><p>1. 点浏览器右上角菜单（⋮）</p><p>2. 选「添加到主屏幕」或「安装应用」</p><p>3. 确认后桌面上就会出现「背词卡」图标</p>')
      + '<p>注意要用 Safari（iPhone）或 Chrome（安卓）打开这个页面再添加；微信里打开的话，先点右上角用浏览器打开。</p></div>';
  }
  h += '</section>';

  /* 外观 */
  h += '<section style="margin-top:1.75rem"><p style="font-size:.875rem;font-weight:600">外观</p>'
    + '<div class="seg" style="margin-top:.5rem" role="group" aria-label="界面外观">'
    + '<button type="button" data-ap="light" aria-pressed="'+(ap==="light")+'" class="'+(ap==="light"?"on":"")+'">白色</button>'
    + '<button type="button" data-ap="dark" aria-pressed="'+(ap==="dark")+'" class="'+(ap==="dark"?"on":"")+'">深色</button></div>'
    + '<p style="margin-top:.375rem;font-size:.75rem;color:var(--dim)">默认白色；选深色会切回原来的深蓝界面，选择会记在这台设备上。</p></section>';

  /* 主题配色 */
  var acc = accentTheme();
  var swatches = [
    {key:"default",label:"朱红",c:"linear-gradient(135deg,#d93a2e,#a97a1c)"},
    {key:"matcha",label:"抹茶绿",c:"linear-gradient(135deg,#6a994e,#386641)"},
    {key:"sakura",label:"樱花粉",c:"linear-gradient(135deg,#ef7d9b,#d95d7e)"},
    {key:"ocean",label:"深海蓝",c:"linear-gradient(135deg,#3b82c4,#1e4d7a)"},
    {key:"grape",label:"藤紫",c:"linear-gradient(135deg,#9b6bc0,#6d3f96)"}
  ];
  h += '<section style="margin-top:1.75rem"><p style="font-size:.875rem;font-weight:600">主题配色</p>'
    + '<div class="swatchrow" style="margin-top:.625rem" role="group" aria-label="主题配色">'
    + swatches.map(function(sw){ return '<button type="button" class="swatch'+(acc===sw.key?" on":"")+'" data-accent-pick="'+sw.key+'" aria-pressed="'+(acc===sw.key)+'" aria-label="主题色 '+sw.label+'"><i style="background:'+sw.c+'"></i>'+sw.label+'</button>'; }).join("")
    + '</div><p style="margin-top:.375rem;font-size:.75rem;color:var(--dim)">换个心情换个色，按钮、进度条和强调色会一起变。</p></section>';

  /* 字号 */
  var fsp = fontSizePref();
  h += '<section style="margin-top:1.75rem"><p style="font-size:.875rem;font-weight:600">字号</p>'
    + '<div class="seg" style="margin-top:.5rem" role="group" aria-label="字号大小">'
    + '<button type="button" data-fsize="s" aria-pressed="'+(fsp==="s")+'" class="'+(fsp==="s"?"on":"")+'" style="font-size:.8125rem">小</button>'
    + '<button type="button" data-fsize="m" aria-pressed="'+(fsp==="m")+'" class="'+(fsp==="m"?"on":"")+'">标准</button>'
    + '<button type="button" data-fsize="l" aria-pressed="'+(fsp==="l")+'" class="'+(fsp==="l"?"on":"")+'" style="font-size:1.0625rem;font-weight:700">大</button></div>'
    + '<p style="margin-top:.375rem;font-size:.75rem;color:var(--dim)">单词太长或眼睛累的时候调大一档，卡片上的大字会跟着放大。</p></section>';

  /* 出题方向 */
  h += '<section style="margin-top:1.75rem"><p style="font-size:.875rem;font-weight:600">出题方向</p>'
    + '<div class="seg" style="margin-top:.5rem" role="group" aria-label="卡片出题方向">'
    + '<button type="button" data-cmode="jp2cn" aria-pressed="'+(s.cardMode==="jp2cn")+'" class="'+(s.cardMode==="jp2cn"?"on":"")+'">日 → 中</button>'
    + '<button type="button" data-cmode="cn2jp" aria-pressed="'+(s.cardMode==="cn2jp")+'" class="'+(s.cardMode==="cn2jp"?"on":"")+'">中 → 日</button></div>'
    + '<p style="margin-top:.375rem;font-size:.75rem;color:var(--dim)">'+(s.cardMode==="cn2jp" ? "卡片正面先出中文释义，你在心里想出日语再翻面确认，适合练输出。" : "卡片正面出日语单词和读音，翻面看中文释义，适合练认读。")+'学习页卡片上方也能随时切换。</p></section>';

  /* 每天新词 */
  h += '<section style="margin-top:1.75rem"><label for="set-count" style="font-size:.875rem;font-weight:600">每天新词数量</label>'
    + '<div style="margin-top:.5rem;display:flex;align-items:center;gap:.75rem">'
    + '<button type="button" id="count-minus" aria-label="减少每天新词数量" class="iconbtn" style="width:2.75rem;height:2.75rem;font-size:1.25rem;font-weight:700;background:var(--surface-2)">−</button>'
    + '<input id="set-count" type="number" inputmode="numeric" aria-label="每天新词数量" value="'+s.dailyCount+'" style="width:5rem;border-radius:.75rem;border:1px solid var(--border);padding:.625rem 0;text-align:center;font-size:1.125rem;font-weight:700;outline:none;background:var(--surface);color:var(--text)">'
    + '<button type="button" id="count-plus" aria-label="增加每天新词数量" class="iconbtn" style="width:2.75rem;height:2.75rem;font-size:1.25rem;font-weight:700;background:var(--surface-2)">+</button>'
    + '<span style="font-size:.875rem;color:var(--dim)">个 / 天（1–50）</span></div></section>';

  /* API Key */
  h += '<section style="margin-top:1.75rem"><label for="set-key" style="font-size:.875rem;font-weight:600">DeepSeek API Key</label>'
    + '<p style="margin-top:.25rem;font-size:.75rem;line-height:1.65;color:var(--dim)">'+(st.hasKey ? "当前已设置："+esc(st.keyHint||"••••")+"。留空保存不会覆盖它。" : "还没有设置。在 platform.deepseek.com 申请 Key 后粘贴到这里。")+'桌面版的 Key 只保存在这台设备的浏览器里，调用 AI 时由浏览器直连 DeepSeek，不经过其他服务器。桌面版和 Muse 版数据不互通，Key 需要在这里再填一次。</p>'
    + '<input id="set-key" type="password" autocomplete="off" placeholder="sk-…" class="input" style="margin-top:.5rem">'
    + (st.hasKey ? '<button type="button" id="key-clear" style="margin-top:.5rem;font-size:.875rem;font-weight:500;color:var(--accent);text-decoration:underline;text-underline-offset:4px;background:none">清除已保存的 Key</button>' : "")
    + '</section>';

  /* 模型 */
  h += '<section style="margin-top:1.75rem"><label for="set-model" style="font-size:.875rem;font-weight:600">模型</label>'
    + '<select id="set-model" aria-label="DeepSeek 模型" class="input" style="margin-top:.5rem;appearance:none">'
    + '<option value="deepseek-chat"'+(s.model==="deepseek-chat"?" selected":"")+'>deepseek-chat（快，推荐）</option>'
    + '<option value="deepseek-reasoner"'+(s.model==="deepseek-reasoner"?" selected":"")+'>deepseek-reasoner（推理更强，较慢）</option></select></section>';

  if(u.notice) h += '<p class="anim-pop notice" style="margin-top:1.25rem;color:'+(u.noticeOk?"var(--jade)":"var(--accent)")+'">'+esc(u.notice)+'</p>';
  h += '<button type="button" id="set-save" class="btn btn-accent" style="margin-top:1.5rem;width:100%;padding:.875rem 0;border-radius:.75rem">保存设置</button>';

  /* 提醒 */
  h += '<section style="margin-top:2.25rem"><p style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600">'+icon(I.bell,17)+' 学习提醒</p>'
    + '<p style="margin-top:.25rem;font-size:.75rem;line-height:1.65;color:var(--dim)">到点之后，如果今天还有没刷完的卡（或连续学习记录要断了），打开应用时会弹一条通知提醒你，一天最多一条。提醒设置只存这台设备。</p>'
    + '<div style="margin-top:.75rem;display:flex;align-items:center;gap:.75rem"><button type="button" id="rem-toggle" role="switch" aria-checked="'+reminderOn+'" aria-label="开启每日学习提醒" class="switch" style="background:'+(reminderOn?"var(--jade)":"var(--surface-2)")+'"><i style="left:'+(reminderOn?26:4)+'px"></i></button><span style="font-size:.875rem;font-weight:500">'+(reminderOn?"已开启":"已关闭")+'</span>'
    + '<input type="time" id="rem-time" aria-label="提醒时间" value="'+esc(reminderTime)+'" '+(reminderOn?"":"disabled")+' style="margin-left:auto;border-radius:.75rem;border:1px solid var(--border);padding:.5rem .75rem;font-size:1rem;outline:none;background:var(--surface);color:var(--text);opacity:'+(reminderOn?1:.4)+'"></div>'
    + (reminderOn && perm==="default" ? '<button type="button" id="rem-perm" class="btn btn-accent" style="margin-top:.75rem;width:100%;padding:.625rem 0;font-size:.875rem;border-radius:.75rem">点这里允许通知，提醒才能弹出来</button>' : "")
    + (reminderOn && perm==="granted" ? '<p style="margin-top:.625rem;font-size:.75rem;color:var(--jade)">通知权限已允许，到点打开应用就会提醒。</p>' : "")
    + (reminderOn && perm==="denied" ? '<p style="margin-top:.625rem;font-size:.75rem;color:var(--accent)">通知被系统拦下了，去系统设置里给浏览器/应用打开通知权限后就能收到提醒。</p>' : "")
    + (reminderOn && perm==="unsupported" ? '<p style="margin-top:.625rem;font-size:.75rem;color:var(--dim)">当前打开方式不支持系统通知；学习页顶部的到期横幅会照常提醒你。</p>' : "")
    + '</section>';

  /* 备份 */
  h += '<section style="margin-top:2.25rem"><p style="display:flex;align-items:center;gap:.5rem;font-size:.875rem;font-weight:600">'+icon(I.download,17)+' 备份与恢复</p>'
    + '<p style="margin-top:.25rem;font-size:.75rem;line-height:1.65;color:var(--dim)">导出会把全部单词、学习进度、复习记录和设置（每天词数、模型、出题方向）存成一个 JSON 文件；API Key 不会写进备份。导入时已有的词不会被覆盖，只补新词和缺失的记录。备份文件和 Muse 版通用，可以互相导入。</p>'
    + '<div style="margin-top:.75rem;display:grid;grid-template-columns:1fr 1fr;gap:.625rem">'
    + '<button type="button" id="bk-export" class="btn btn-jade" style="padding:.75rem 0;border-radius:.75rem">'+icon(I.download,18)+' 导出备份</button>'
    + '<button type="button" id="bk-import" class="btn btn-surface" style="padding:.75rem 0;border-radius:.75rem">'+icon(I.upload,18)+' 导入备份</button></div>'
    + '<button type="button" id="bk-share" class="btn btn-surface" style="margin-top:.625rem;width:100%;padding:.75rem 0;border-radius:.75rem">'+icon(I.share,18)+' 分享备份文件（发到邮箱 / 文件）</button>'
    + '<input type="file" id="bk-file" accept=".json,application/json" aria-label="选择备份文件导入" style="display:none">'
    + (u.backupMsg ? '<p class="anim-pop notice" role="status" style="margin-top:.75rem;color:'+(u.backupOk?"var(--jade)":"var(--accent)")+'">'+esc(u.backupMsg)+'</p>' : "")
    + '</section>';

  h += '<section style="margin-top:2rem;border-radius:1rem;padding:1rem;font-size:.875rem;line-height:1.7;background:var(--surface);color:var(--dim)"><p style="margin-bottom:.25rem;font-weight:600;color:var(--text)">复习节奏</p>滑「认识」后，单词会按 1 天 → 3 天 → 7 天 → 16 天的间隔回来复习；滑「不认识」则明天就会再见到它。连续学习天数会记在学习页顶部。</section>';
  h += '<p style="margin-top:1.5rem;text-align:center;font-size:.75rem;line-height:1.7;color:var(--dim)">桌面版说明：词库、进度和 Key 都只存在这台设备的浏览器里，<br>清除浏览器数据会一起清掉，记得定期用上面的备份导出存一份。</p>';
  h += '</div>';
  view.innerHTML = h;

  /* install action */
  var ia = document.getElementById("install-action");
  if(ia){
    if(deferredInstallEvt){
      ia.innerHTML = '<button type="button" id="install-now" class="btn btn-grad" style="width:100%;padding:.75rem 0">一键安装到桌面</button>';
      document.getElementById("install-now").addEventListener("click", function(){
        if(!deferredInstallEvt) return;
        var evt = deferredInstallEvt;
        evt["prompt"]();
        evt.userChoice.then(function(){ deferredInstallEvt = null; render(); });
      });
    } else if(isIOS()){
      ia.innerHTML = '<p style="font-size:.8125rem;color:var(--dim)">按下面三步操作就行，不用装任何东西。</p>';
    } else {
      ia.innerHTML = '<p style="font-size:.8125rem;color:var(--dim)">按下面步骤操作就行；部分浏览器菜单里这一项叫「安装应用」。</p>';
    }
  }
  Array.prototype.forEach.call(view.querySelectorAll("[data-ap]"), function(b){
    b.addEventListener("click", function(){ lsSet("vocab-appearance", b.getAttribute("data-ap")); applyAppearance(); render(); });
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-accent-pick]"), function(b){
    b.addEventListener("click", function(){ var v=b.getAttribute("data-accent-pick"); if(v==="default") lsDel("vocab-accent"); else lsSet("vocab-accent", v); applyAccent(); render(); });
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-fsize]"), function(b){
    b.addEventListener("click", function(){ lsSet("vocab-fontsize", b.getAttribute("data-fsize")); applyFontSize(); render(); });
  });
  Array.prototype.forEach.call(view.querySelectorAll("[data-cmode]"), function(b){
    b.addEventListener("click", function(){ DB.settings.cardMode = b.getAttribute("data-cmode"); saveDB(); render(); });
  });
  var cnt = document.getElementById("set-count");
  document.getElementById("count-minus").addEventListener("click", function(){ cnt.value = Math.max(1,(parseInt(cnt.value,10)||10)-1); });
  document.getElementById("count-plus").addEventListener("click", function(){ cnt.value = Math.min(50,(parseInt(cnt.value,10)||10)+1); });
  var kc = document.getElementById("key-clear");
  if(kc) kc.addEventListener("click", function(){
    DB.settings.apiKey = ""; saveDB();
    u.noticeOk = true; u.notice = "API Key 已清除。"; render();
  });
  document.getElementById("set-save").addEventListener("click", function(){
    var n = Math.min(50, Math.max(1, parseInt(cnt.value,10)||10));
    DB.settings.dailyCount = n;
    DB.settings.model = document.getElementById("set-model").value;
    var keyVal = document.getElementById("set-key").value.trim();
    if(keyVal) DB.settings.apiKey = keyVal;
    saveDB();
    u.noticeOk = true;
    u.notice = DB.settings.apiKey ? "已保存。现在可以去学习页生成今日单词了。" : "已保存。记得填上 API Key 才能用 AI 功能。";
    render();
  });
  var rt = document.getElementById("rem-toggle");
  rt.addEventListener("click", function(){
    var on = lsGet("vocab-reminder-enabled")==="1";
    lsSet("vocab-reminder-enabled", on ? "0" : "1"); render();
  });
  var rtime = document.getElementById("rem-time");
  rtime.addEventListener("change", function(){ lsSet("vocab-reminder-time", rtime.value || "20:00"); });
  var rp = document.getElementById("rem-perm");
  if(rp) rp.addEventListener("click", function(){
    try{ Notification.requestPermission().then(function(){ render(); }); }catch(e){ render(); }
  });
  function exportData(){
    var nameById = {}; DB.words.forEach(function(w){ nameById[w.id]=w.word; });
    return {
      version: 1, exportedAt: new Date().toISOString(),
      words: DB.words.map(function(w){ return { id:w.id, word:w.word, reading:w.reading, pos:w.pos, meaning:w.meaning, exampleJp:w.exampleJp, exampleCn:w.exampleCn, mnemonic:w.mnemonic, freqRank:w.freqRank, box:w.box, dueDate:w.dueDate, batchDate:w.batchDate, source:w.source, createdAt:w.createdAt||new Date().toISOString() }; }),
      reviews: DB.reviews.filter(function(r){ return nameById[r.wordId]; }).map(function(r){ return { word:nameById[r.wordId], result:r.result, date:r.date }; }),
      settings: { dailyCount: DB.settings.dailyCount, model: DB.settings.model, cardMode: DB.settings.cardMode }
    };
  }
  function downloadBackup(){
    var data = exportData();
    var blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "日语背词卡备份-"+data.exportedAt.slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    u.backupOk = true; u.backupMsg = "已导出 "+data.words.length+" 个词和 "+data.reviews.length+" 条复习记录，存好这个文件就能随时恢复。";
    render();
  }
  document.getElementById("bk-export").addEventListener("click", downloadBackup);
  document.getElementById("bk-share").addEventListener("click", function(){
    var data = exportData();
    var file = new File([JSON.stringify(data,null,2)], "日语背词卡备份-"+data.exportedAt.slice(0,10)+".json", {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:"日语背词卡备份"}).then(function(){
        u.backupOk = true; u.backupMsg = "备份文件已分享出去，收好就行。"; render();
      }).catch(function(){});
    } else {
      downloadBackup();
    }
  });
  var fileInput = document.getElementById("bk-file");
  document.getElementById("bk-import").addEventListener("click", function(){ fileInput.click(); });
  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0]; fileInput.value = "";
    if(!f) return;
    f.text().then(function(text){
      var data;
      try{ data = JSON.parse(text); }catch(e){ u.backupOk = false; u.backupMsg = "这个文件不是有效的备份文件（无法解析）。"; render(); return; }
      var res = importBackup(data);
      if(res.ok){ u.backupOk = true; u.backupMsg = "导入完成：新增 "+res.importedWords+" 个词、"+res.importedReviews+" 条复习记录"+(res.skippedWords ? "；"+res.skippedWords+" 个已有的词保持不变" : "")+"。"; }
      else { u.backupOk = false; u.backupMsg = res.error; }
      render();
    }).catch(function(){ u.backupOk = false; u.backupMsg = "导入失败，请重试。"; render(); });
  });
}
function importBackup(data){
  if(!data || !Array.isArray(data.words)) return { ok:false, error:"备份文件格式不对，请选择由本应用导出的备份文件。" };
  var today = todayJST();
  var idByWord = {}; DB.words.forEach(function(w){ idByWord[w.word]=w.id; });
  var importedWords = 0, skippedWords = 0;
  data.words.slice(0,3000).forEach(function(bw){
    var word = String(bw.word||"").trim();
    if(!word) return;
    if(idByWord[word]){ skippedWords++; return; }
    var id = DB.nextWordId++;
    DB.words.push({ id:id, word:word, reading:String(bw.reading||""), pos:String(bw.pos||""), meaning:String(bw.meaning||""), exampleJp:String(bw.exampleJp||""), exampleCn:String(bw.exampleCn||""), mnemonic: bw.mnemonic ? String(bw.mnemonic) : null, freqRank: (bw.freqRank>=1&&bw.freqRank<=5)?bw.freqRank:null, box: Math.min(4, Math.max(0, parseInt(bw.box,10)||0)), dueDate: /^\d{4}-\d{2}-\d{2}$/.test(bw.dueDate||"") ? bw.dueDate : today, batchDate: /^\d{4}-\d{2}-\d{2}$/.test(bw.batchDate||"") ? bw.batchDate : today, source: String(bw.source||"ai"), createdAt: bw.createdAt || new Date().toISOString() });
    idByWord[word] = id; importedWords++;
  });
  var seen = {}; DB.reviews.forEach(function(r){ seen[r.wordId+"|"+r.date+"|"+r.result]=1; });
  var importedReviews = 0;
  (Array.isArray(data.reviews) ? data.reviews : []).slice(0,30000).forEach(function(r){
    var wid = idByWord[r.word]; if(!wid) return;
    if(r.result!=="known" && r.result!=="unknown") return;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")) return;
    var k = wid+"|"+r.date+"|"+r.result;
    if(seen[k]) return; seen[k]=1;
    DB.reviews.push({ id: DB.nextReviewId++, wordId: wid, result: r.result, date: r.date }); importedReviews++;
  });
  if(data.settings){
    if(data.settings.dailyCount>=1 && data.settings.dailyCount<=50) DB.settings.dailyCount = Math.round(data.settings.dailyCount);
    if(data.settings.model) DB.settings.model = String(data.settings.model).slice(0,60);
    if(data.settings.cardMode==="jp2cn" || data.settings.cardMode==="cn2jp") DB.settings.cardMode = data.settings.cardMode;
  }
  saveDB();
  return { ok:true, importedWords:importedWords, skippedWords:skippedWords, importedReviews:importedReviews };
}
