<style>
:root{
  color-scheme:light;
  --bg:#ffffff;--bg-deep:#f3f4f6;--bg-glow:#edf0f5;
  --surface:#f2f3f5;--surface-2:#e7e9ee;
  --paper:#ffffff;--paper-dim:#f5f2ea;
  --ink:#232946;--ink-dim:#5c627a;
  --text:#1e2235;--dim:#68708a;--border:#e0e3ea;
  --accent:#d93a2e;--jade:#1f8a5b;--gold:#a97a1c;
  --nav-bg:rgba(255,255,255,.94);
  --card-shadow:0 12px 32px rgba(30,35,60,.13),0 2px 8px rgba(30,35,60,.07);
  --radius:18px;
  --font-mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","YuMincho","Yu Mincho","Noto Serif JP","Songti SC",serif;
  --font-gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131a2c;--bg-deep:#0d1220;--bg-glow:#22304f;
  --surface:#1c2740;--surface-2:#243152;
  --paper:#faf7f0;--paper-dim:#efe9db;
  --ink:#232946;--ink-dim:#5c627a;
  --text:#f2f0e9;--dim:#9aa3bd;--border:#2e3a5c;
  --accent:#e2483d;--jade:#2f9e6e;--gold:#d9a441;
  --nav-bg:rgba(13,18,32,.78);
  --card-shadow:0 18px 44px rgba(0,0,0,.45);
}
/* ---- accent colour themes (Settings → 主题配色) ---- */
:root[data-accent="matcha"]{--accent:#4f7d3a;--jade:#2f9e6e;--gold:#8a9a2e;--bg-glow:#e6efd8;}
:root[data-accent="matcha"][data-theme="dark"]{--accent:#7fb069;--gold:#b5c267;--bg-glow:#2a3d22;}
:root[data-accent="sakura"]{--accent:#d95d7e;--jade:#3a9e7a;--gold:#c98a2e;--bg-glow:#fbe4ec;}
:root[data-accent="sakura"][data-theme="dark"]{--accent:#ef7d9b;--gold:#e0aa5a;--bg-glow:#3d2233;}
:root[data-accent="ocean"]{--accent:#2563a8;--jade:#1f8a6e;--gold:#b07d1e;--bg-glow:#dbeafe;}
:root[data-accent="ocean"][data-theme="dark"]{--accent:#5b9bd5;--gold:#d9a441;--bg-glow:#1c3352;}
:root[data-accent="grape"]{--accent:#7c4da0;--jade:#2f9e6e;--gold:#a97a1c;--bg-glow:#ede4f5;}
:root[data-accent="grape"][data-theme="dark"]{--accent:#b07fd0;--gold:#d9a441;--bg-glow:#2e2145;}
#app,header.topbar,main.view,nav.bottomnav,nav.bottomnav .row,.cardbox,.wordrow,.statcell,.seg,.optbtn,.notice,.face,.deck,.swipe-wrap{box-sizing:border-box}
html,body{overscroll-behavior:none;background:var(--bg);}
body{margin:0;font-family:var(--font-gothic);-webkit-tap-highlight-color:transparent;overflow-x:clip;color:var(--text);}
h1,h2,h3,p,ul,ol,figure{margin:0;padding:0;}
ul,ol{list-style:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem;}
input,select,textarea{font-family:inherit;}
img{max-width:100%;}
.mincho{font-family:var(--font-mincho);}
@keyframes pop-in{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rise-in{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes confetti-fall{0%{transform:translateY(-8vh) rotate(0deg);opacity:1}100%{transform:translateY(52vh) rotate(560deg);opacity:0}}
@keyframes flame-flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.14) rotate(2.5deg)}}
@keyframes stamp-in{0%{transform:scale(1.7) rotate(var(--stamp-rot,-12deg));opacity:0}100%{transform:scale(1) rotate(var(--stamp-rot,-12deg));opacity:1}}
@keyframes drift-a{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,30px) scale(1.12)}}
@keyframes drift-b{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-38px,22px) scale(.94)}}
@keyframes slide-up-fade{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes grow-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cell-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes toast-in{0%{transform:translateY(-14px) scale(.94);opacity:0}60%{transform:translateY(2px) scale(1.02);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes shake-x{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spring-up{0%{transform:translateY(14px) scale(.955)}55%{transform:translateY(-3px) scale(1.008)}100%{transform:translateY(0) scale(1)}}
@keyframes fly-into-deck{0%{transform:translate(var(--fx,60px),-46vh) rotate(var(--fr,14deg)) scale(.82);opacity:0}18%{opacity:1}70%{transform:translate(calc(var(--fx,60px)*.12),10px) rotate(calc(var(--fr,14deg)*.25)) scale(1.02);opacity:1}100%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1}}
@keyframes gen-fly{0%{transform:translate(var(--fx,80px),-52vh) rotate(var(--fr,18deg));opacity:0}15%{opacity:1}100%{transform:translate(0,0) rotate(var(--fr2,-3deg));opacity:1}}
@keyframes wave-slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes pulse-soft{0%,100%{opacity:.55}50%{opacity:1}}
.anim-pulse{animation:pulse-soft 1.1s ease-in-out infinite}
@keyframes splash-out{to{opacity:0;visibility:hidden}}
@keyframes splash-pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.deck-spring{animation:spring-up .5s cubic-bezier(.2,1.4,.36,1) both}
.card-fly-in{animation:fly-into-deck .65s cubic-bezier(.22,1,.36,1) both}
.gen-fly-card{position:absolute;inset:0;border-radius:var(--radius);background:var(--paper);border:1px solid var(--border);box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;color:var(--ink);animation:gen-fly .7s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){.deck-spring,.card-fly-in,.gen-fly-card{animation:none}}
.anim-pop{animation:pop-in .45s cubic-bezier(.22,1.4,.36,1) both}
.anim-rise{animation:rise-in .4s ease-out both}
.anim-flame{animation:flame-flicker 1.6s ease-in-out infinite;transform-origin:50% 90%;display:inline-flex}
.anim-stamp{animation:stamp-in .18s ease-out both}
.anim-slide-up{animation:slide-up-fade .35s ease-out both}
.anim-cell{animation:cell-pop .3s ease-out both}
.anim-toast{animation:toast-in .4s cubic-bezier(.22,1.2,.36,1) both}
.anim-shake{animation:shake-x .4s ease both}
.anim-grow-x{animation:grow-bar .6s ease-out both;transform-origin:left center}
.swipe-card{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
.no-scrollbar::-webkit-scrollbar{display:none;width:0;height:0}
@media (prefers-reduced-motion:reduce){.anim-pop,.anim-rise,.anim-flame,.anim-stamp,.anim-slide-up,.anim-cell,.anim-toast,.anim-shake,.anim-grow-x{animation:none}}
/* ---------- shell ---------- */
#app{position:relative;display:flex;min-height:100dvh;flex-direction:column;overflow-x:clip;background:radial-gradient(120% 60% at 50% -10%,var(--bg-glow) 0%,var(--bg) 55%,var(--bg-deep) 100%);}
.glowwrap{pointer-events:none;position:absolute;inset:0;overflow:hidden}
.glow-a{position:absolute;top:-6rem;left:-6rem;width:18rem;height:18rem;border-radius:9999px;opacity:.5;filter:blur(48px);background:var(--bg-glow);animation:drift-a 16s ease-in-out infinite}
.glow-b{position:absolute;top:33%;right:-7rem;width:20rem;height:20rem;border-radius:9999px;opacity:.4;filter:blur(48px);background:var(--bg-glow);animation:drift-b 20s ease-in-out infinite}
header.topbar{margin:0 auto;display:flex;width:100%;max-width:36rem;align-items:center;padding:1rem 1.25rem .25rem;position:relative;z-index:1}
header.topbar .ttl{font-family:var(--font-mincho);font-size:1.125rem;font-weight:700;line-height:1.25}
header.topbar .sub{font-size:.75rem;color:var(--dim)}
.streakpill{margin-left:auto;display:flex;align-items:center;gap:.375rem;border-radius:9999px;padding:.375rem .75rem;font-size:.875rem;font-weight:700;background:var(--surface);color:var(--gold)}
main.view{margin:0 auto;width:100%;max-width:36rem;flex:1;padding:.75rem 1.25rem 8rem;position:relative;z-index:1}
nav.bottomnav{position:fixed;left:.75rem;right:.75rem;bottom:calc(.65rem + env(safe-area-inset-bottom));z-index:20;max-width:34rem;margin:0 auto;border:1px solid color-mix(in srgb,var(--border) 70%,transparent);border-radius:9999px;background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 12px 32px rgba(20,24,40,.18),0 2px 8px rgba(20,24,40,.08),inset 0 1px 0 rgba(255,255,255,.35);padding:.25rem}
nav.bottomnav .row{margin:0 auto;display:flex;max-width:36rem}
nav.bottomnav button{border-radius:9999px}
nav.bottomnav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
nav.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.625rem 0;transition:transform .15s}
nav.bottomnav button:active{transform:scale(.95)}
nav.bottomnav .lbl{font-size:11px}
nav.bottomnav .dot{width:4px;height:4px;border-radius:9999px;background:var(--accent)}
/* ---------- generic ---------- */
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:9999px;padding:.25rem .625rem;font-size:.75rem;font-weight:500;background:var(--surface-2);color:var(--dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;border-radius:9999px;font-weight:600;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.55}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 10px 24px rgba(30,35,60,.18)}
.btn-jade{background:var(--jade);color:#fff}
.btn-surface{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-grad{background:linear-gradient(120deg,var(--gold),var(--accent));color:#fff;box-shadow:0 10px 24px rgba(30,35,60,.18)}
.input{width:100%;border-radius:.75rem;border:1px solid var(--border);padding:.75rem 1rem;font-size:1rem;outline:none;background:var(--surface);color:var(--text);box-sizing:border-box}
.input::placeholder{opacity:.5}
.cardbox{background:var(--surface);border-radius:1rem}
.seg{display:flex;border-radius:.75rem;border:1px solid var(--border);padding:.25rem;background:var(--surface)}
.seg button{flex:1;border-radius:.5rem;padding:.625rem .5rem;font-size:.875rem;font-weight:600;transition:all .15s;color:var(--dim)}
.seg button.on{background:var(--paper);color:var(--text);box-shadow:var(--card-shadow)}
.seg-pill{display:flex;border-radius:9999px;padding:.25rem;background:var(--surface)}
.seg-pill button{border-radius:9999px;padding:.375rem .875rem;font-size:.75rem;font-weight:600;transition:all .15s;color:var(--dim)}
.seg-pill button.on{background:var(--paper);color:var(--text);box-shadow:var(--card-shadow)}
.progress{height:.85rem;overflow:hidden;border-radius:9999px;background:var(--surface-2);position:relative;box-shadow:inset 0 1px 3px rgba(20,24,40,.12)}
.progress>div{height:100%;border-radius:9999px;transition:width .6s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,var(--gold),var(--accent));position:relative;overflow:hidden;min-width:0}
.progress>div .wave{position:absolute;top:-.45rem;left:0;width:200%;height:.6rem;opacity:.5;background:radial-gradient(circle at 10px -3px,transparent 11px,#fff 12px);background-size:22px 12px;animation:wave-slide 1.6s linear infinite;pointer-events:none}
.progress>div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);pointer-events:none}
.progress.sm{height:.5rem}
.progress.sm>div .wave{display:none}
.liquid-wrap{position:relative}
.swatchrow{display:flex;gap:.625rem;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:.375rem;font-size:.75rem;font-weight:600;color:var(--dim)}
.swatch i{display:block;width:2.75rem;height:2.75rem;border-radius:9999px;border:3px solid transparent;box-shadow:0 4px 12px rgba(20,24,40,.18);transition:transform .15s}
.swatch:active i{transform:scale(.92)}
.swatch.on{color:var(--text)}
.swatch.on i{border-color:var(--text);transform:scale(1.06)}
.notice{border-radius:.75rem;padding:.75rem 1rem;font-size:.875rem;background:var(--surface)}
.spinner{margin:0 auto;width:2.5rem;height:2.5rem;border-radius:9999px;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;transition:transform .15s}
.iconbtn:active{transform:scale(.9)}
/* ---------- study / swipe card ---------- */
.deck{position:relative;margin:0 auto 10px;height:430px;max-height:58dvh;width:100%;max-width:430px;touch-action:none}
.deck::after{content:"";position:absolute;left:6%;right:6%;bottom:-14px;height:22px;border-radius:9999px;background:radial-gradient(50% 100% at 50% 0,rgba(20,24,40,.16),transparent 70%);pointer-events:none}
.swipe-wrap{position:absolute;inset:0;will-change:transform}
.flip-persp{position:relative;width:100%;height:100%;perspective:1200px}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.face{position:absolute;inset:0;overflow:hidden;border-radius:var(--radius);background:var(--paper);color:var(--ink);border:1px solid var(--border);box-shadow:var(--card-shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{overflow-y:auto;transform:rotateY(180deg)}
.face .centercol{display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;padding:0 1.5rem;text-align:center}
.poschip{margin-bottom:1rem;border-radius:9999px;padding:.25rem .75rem;font-size:.75rem;font-weight:600;letter-spacing:.05em;background:var(--paper-dim);color:var(--ink-dim)}
.bigword{font-family:var(--font-mincho);font-weight:600;line-height:1.1}
.reading{font-family:var(--font-mincho);color:var(--ink-dim)}
.freqtag{border-radius:9999px;padding:.25rem .75rem;font-size:.75rem;font-weight:700;background:var(--gold);color:#fff}
.hint{font-size:.75rem;letter-spacing:.3em;color:var(--ink-dim)}
.stamp{position:absolute;top:1.5rem;border:3px solid;border-radius:.375rem;padding:.25rem .75rem;font-size:1.25rem;font-weight:700;letter-spacing:.1em;z-index:3}
.stamp.no{left:1.25rem;border-color:var(--accent);color:var(--accent);--stamp-rot:-14deg;transform:rotate(-14deg)}
.stamp.yes{right:1.25rem;border-color:var(--jade);color:var(--jade);--stamp-rot:14deg;transform:rotate(14deg)}
.glowedge{pointer-events:none;position:absolute;top:0;bottom:0;width:6rem;z-index:2}
.boxdots{display:inline-flex;align-items:center;gap:.25rem}
.boxdots i{width:6px;height:6px;border-radius:9999px;background:var(--border);display:block}
.swipebtns{margin-top:1.25rem;display:flex;align-items:flex-start;justify-content:center;gap:2.5rem}
.swipebtns .col{display:flex;flex-direction:column;align-items:center;gap:.375rem}
.swipebtns .round{width:4rem;height:4rem;border-radius:9999px;color:#fff;box-shadow:0 10px 24px rgba(30,35,60,.25);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.swipebtns .round:active{transform:scale(.9)}
.swipebtns .cap{font-size:.75rem;color:var(--dim)}
.confetti{pointer-events:none;position:absolute;top:0;border-radius:2px;animation:confetti-fall 1.6s ease-in both}
/* ---------- lists / misc ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.625rem}
.statcell{border-radius:1rem;padding:.875rem .75rem;text-align:center;background:var(--surface)}
.statcell .num{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.statcell .cap{margin-top:2px;font-size:.75rem;color:var(--dim)}
.heat{display:flex;gap:3px}
.heat .wk{display:flex;flex:1;flex-direction:column;gap:3px}
.heat .cell{aspect-ratio:1;width:100%;border-radius:3px}
.forecast-row{display:flex;align-items:center;gap:.5rem;font-size:.75rem}
.bar-track{height:.625rem;flex:1;overflow:hidden;border-radius:9999px;background:var(--surface-2)}
.bar-fill{height:100%;border-radius:9999px}
.wordrow{background:var(--surface);border-radius:1rem;padding:.75rem 1rem}
.filterrow{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem}
.filterrow button{flex-shrink:0;border-radius:9999px;padding:.5rem 1rem;font-size:.875rem;font-weight:500;background:var(--surface);color:var(--dim);transition:all .15s}
.filterrow button.on{background:var(--accent);color:#fff}
.optbtn{display:flex;width:100%;align-items:center;gap:.75rem;border-radius:1rem;padding:.875rem 1rem;text-align:left;font-weight:500;background:var(--surface);border:1px solid var(--border);transition:all .15s}
.optbtn:active{transform:scale(.98)}
.switch{position:relative;height:2rem;width:3.5rem;flex-shrink:0;border-radius:9999px;transition:background .2s;background:var(--surface-2)}
.switch i{position:absolute;top:4px;width:1.5rem;height:1.5rem;border-radius:9999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .2s;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:6.5rem;z-index:50;max-width:92vw;border-radius:9999px;padding:.625rem 1.125rem;font-size:.875rem;font-weight:600;background:var(--ink);color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center}
.install-steps{display:grid;gap:.5rem;font-size:.8125rem;line-height:1.55;color:var(--dim)}
.install-steps b{color:var(--text)}
.kbd{display:inline-block;border:1px solid var(--border);border-bottom-width:2px;border-radius:.375rem;padding:0 .375rem;font-size:.75rem;background:var(--surface)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:radial-gradient(120% 60% at 50% -10%,var(--bg-glow) 0%,var(--bg) 60%);animation:splash-out .45s ease 1.05s both;pointer-events:none}
#splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 16px 36px rgba(20,24,40,.22);animation:splash-pop .55s cubic-bezier(.22,1.3,.36,1) both}
#splash .sp-ttl{font-family:var(--font-mincho);font-size:1.5rem;font-weight:700;color:var(--text)}
#splash .sp-sub{font-size:.8125rem;color:var(--dim);letter-spacing:.2em}
@media (prefers-reduced-motion:reduce){#splash{animation-duration:.1s;animation-delay:.1s}#splash img{animation:none}}
@media (min-width:640px){.twocol{display:grid;grid-template-columns:1fr 1fr;gap:.625rem}}
</style>

<script>
"use strict";
/* ================= 日语背词卡（桌面版） =================
   与 Muse 版功能一致的独立版：数据保存在这台设备的浏览器里，
   DeepSeek 由浏览器直连调用（Key 只存在本机）。可通过浏览器
   「添加到主屏幕」像 App 一样从桌面打开。 */
var STORE_KEY = "riyu-desktop-v1";
var BOX_INTERVALS = [1, 3, 7, 16, 35];
var FREQ_LABEL = {1:"高频必考",2:"常见",3:"一般",4:"较少见",5:"生僻"};

function todayJST(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo"}).format(new Date());
}
function addDays(dateStr, days){
  var d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- persistent store (this device only) ---------- */
function defaultStore(){
  return {
    words: [], reviews: [], lookupHistory: [],
    settings: { dailyCount: 10, apiKey: "", model: "deepseek-chat", cardMode: "jp2cn" },
    nextWordId: 1, nextReviewId: 1, nextHistId: 1
  };
}
var DB = (function(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var p = JSON.parse(raw); if(p && Array.isArray(p.words)) return Object.assign(defaultStore(), p); }
  }catch(e){}
  return defaultStore();
})();
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }

/* ---------- icons ---------- */

/* ---------- speech & haptics ---------- */
function speakJa(text){
  try{
    if(!("speechSynthesis" in window) || !String(text||"").trim()) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.88;
    var ja = window.speechSynthesis.getVoices().filter(function(v){ return v.lang.toLowerCase().indexOf("ja")===0; })[0];
    if(ja) u.voice = ja;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- DeepSeek (direct from browser) ---------- */
function parseJsonObject(raw){
  var cleaned = String(raw).replace(/```(?:json)?/gi,"").trim();
  var s = cleaned.indexOf("{"), e = cleaned.lastIndexOf("}");
  if(s===-1 || e===-1 || e<=s) throw new Error("AI 返回格式异常，请重试。");
  return JSON.parse(cleaned.slice(s, e+1));
}
function callDeepSeek(system, user){
  var key = DB.settings.apiKey, model = DB.settings.model;
  if(!key) return Promise.reject(new Error("还没有设置 DeepSeek API Key。去「设置」里填上你的 Key。"));
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 90000) : null;
  return fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
    body: JSON.stringify({ model: model, messages: [{role:"system",content:system},{role:"user",content:user}], response_format:{type:"json_object"}, temperature: 0.7 }),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(res){
    if(timer) clearTimeout(timer);
    if(!res.ok){
      if(res.status===401) throw new Error("DeepSeek API Key 无效或已过期，请在设置里检查。");
      if(res.status===402) throw new Error("DeepSeek 账户余额不足，请充值后再试。");
      throw new Error("DeepSeek 调用失败（"+res.status+"），请重试。");
    }
    return res.json();
  }).then(function(data){
    var content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!content) throw new Error("DeepSeek 没有返回内容，请重试。");
    return content;
  }).catch(function(e){
    if(timer) clearTimeout(timer);
    if(e && e.name==="AbortError") throw new Error("AI 响应超时，请重试。");
    if(e instanceof TypeError) throw new Error("连不上 DeepSeek，请检查网络后重试。");
    throw e;
  });
}
function normWord(w){
  return {
    word: String(w.word||"").trim(), reading: String(w.reading||""), pos: String(w.pos||""),
    meaning: String(w.meaning||""), exampleJp: String(w.exampleJp||""), exampleCn: String(w.exampleCn||""),
    mnemonic: w.mnemonic ? String(w.mnemonic) : null,
    freqRank: (w.freqRank>=1 && w.freqRank<=5) ? Math.round(w.freqRank) : null
  };
}
function generateWords(count){
  var known = DB.words.map(function(w){ return w.word; }).slice(-300);
  var system = "你是一位资深日语教师，专长是 JLPT N1 词汇教学。只输出 JSON，不要输出任何其他文字。";
  var user = [
    "请生成 " + count + " 个 JLPT N1 级别的常用日语单词（名词、动词、形容词、副词混合，不要过于生僻）。",
    known.length ? "以下单词用户已经学过，不要重复：" + known.join("、") : "",
    "每个单词给出：word（单词原形，含汉字）、reading（平假名读音）、pos（词性，中文，如 名词/动词/い形容词/な形容词/副词）、meaning（简明中文释义）、exampleJp（一个自然的日文例句）、exampleCn（例句的中文翻译）、mnemonic（一句中文助记：拆字、谐音或联想，简短有趣）、freqRank（词频等级，整数 1-5：1=最高频、N1 考试最常考，2=常见，3=一般，4=较少见，5=生僻）。",
    '输出格式：{"words":[{"word":"…","reading":"…","pos":"…","meaning":"…","exampleJp":"…","exampleCn":"…","mnemonic":"…","freqRank":1}]}'
  ].filter(Boolean).join("\n");
  return callDeepSeek(system, user).then(function(raw){
    var parsed = parseJsonObject(raw);
    var list = (parsed.words || []).map(normWord);
    var seen = {}; DB.words.forEach(function(w){ seen[w.word]=1; });
    var fresh = list.filter(function(w){ return w.word && !seen[w.word]; });
    if(!fresh.length) throw new Error("AI 这次没有返回新词，请再点一次生成。");
    var today = todayJST();
    fresh.forEach(function(w){
      DB.words.push({ id: DB.nextWordId++, word:w.word, reading:w.reading, pos:w.pos, meaning:w.meaning, exampleJp:w.exampleJp, exampleCn:w.exampleCn, mnemonic:w.mnemonic, freqRank:w.freqRank, box:0, dueDate:today, batchDate:today, source:"ai", createdAt:new Date().toISOString() });
    });
    saveDB();
    return fresh.length;
  });
}
function aiMnemonic(word, regenerate){
  var system = "你是一位擅长记忆术的日语教师。只输出 JSON，不要输出任何其他文字。";
  var user;
  if(regenerate){
    user = ["为日语单词「"+word.word+"」（读音 "+word.reading+"，意思："+word.meaning+"）重新写一句中文助记。",
      word.mnemonic ? "之前的助记是：「"+word.mnemonic+"」——这次必须换一个完全不同的角度（拆字、谐音、场景联想三选一，避开上次用的那种），不要和它雷同。" : "结合拆字、谐音或场景联想，简短有趣、一看就记得住。",
      '另外给一个更地道的日文例句及其中文翻译。输出格式：{"mnemonic":"…","exampleJp":"…","exampleCn":"…"}'].join("\n");
  } else {
    user = "为日语单词「"+word.word+"」（读音 "+word.reading+"，意思："+word.meaning+"）写一句中文助记，结合拆字、谐音或场景联想，简短有趣、一看就记得住。另外给一个更地道的日文例句及其中文翻译。输出格式：{\"mnemonic\":\"…\",\"exampleJp\":\"…\",\"exampleCn\":\"…\"}";
  }
  return callDeepSeek(system, user).then(function(raw){
    var p = parseJsonObject(raw);
    if(!p.mnemonic) throw new Error("生成失败，请重试。");
    word.mnemonic = String(p.mnemonic);
    if(p.exampleJp){ word.exampleJp = String(p.exampleJp); word.exampleCn = String(p.exampleCn||""); }
    saveDB();
    return word.mnemonic;
  });
}

/* ---------- derived state (mirrors the Muse version) ---------- */
function computeState(){
  var today = todayJST();
  var all = DB.words.slice().sort(function(a,b){ return a.id-b.id; });
  var todayReviews = DB.reviews.filter(function(r){ return r.date===today; });
  var reviewedIds = {}; todayReviews.forEach(function(r){ reviewedIds[r.wordId]=1; });
  var batch = all.filter(function(w){ return w.batchDate===today; });
  var due = all.filter(function(w){ return w.batchDate!==today && w.dueDate<=today; });
  function byFreq(a,b){ return ((a.freqRank==null?99:a.freqRank)-(b.freqRank==null?99:b.freqRank)) || (a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:0) || (a.id-b.id); }
  var queue = batch.slice().sort(byFreq).concat(due.slice().sort(byFreq)).filter(function(w){ return !reviewedIds[w.id]; });
  var tomorrow = addDays(today,1);
  var dates = {}; DB.reviews.forEach(function(r){ dates[r.date]=1; });
  var dateList = Object.keys(dates).sort();
  var streak = 0, cursor = today;
  if(dateList.indexOf(cursor)===-1) cursor = addDays(cursor,-1);
  while(dateList.indexOf(cursor)!==-1){ streak++; cursor = addDays(cursor,-1); }
  var byDate = {};
  DB.reviews.forEach(function(r){ var c = byDate[r.date] || (byDate[r.date]={count:0,known:0}); c.count++; if(r.result==="known") c.known++; });
  var calendar = [];
  for(var i=0;i<84;i++){ var d = addDays(today, i-83); var c2 = byDate[d]||{count:0,known:0}; calendar.push({date:d,count:c2.count,known:c2.known}); }
  var latest = {};
  DB.reviews.slice().sort(function(a,b){ return a.id-b.id; }).forEach(function(r){ latest[r.wordId]=r.result; });
  var unknownCount = all.filter(function(w){ return latest[w.id]==="unknown"; }).length;
  var knownTotal = DB.reviews.filter(function(r){ return r.result==="known"; }).length;
  var weekStart = addDays(today,-6);
  var byId = {}; all.forEach(function(w){ byId[w.id]=w; });
  return {
    today: today, dailyCount: DB.settings.dailyCount, model: DB.settings.model,
    hasKey: !!DB.settings.apiKey,
    keyHint: DB.settings.apiKey ? (DB.settings.apiKey.length<=8 ? "••••" : DB.settings.apiKey.slice(0,3)+"••••"+DB.settings.apiKey.slice(-4)) : null,
    batchExists: batch.length>0, batchTotal: batch.length+due.length,
    reviewedToday: todayReviews.length, knownToday: todayReviews.filter(function(r){ return r.result==="known"; }).length,
    queue: queue, totalWords: all.length, masteredWords: all.filter(function(w){ return w.box>=3; }).length,
    streak: streak, totalReviews: DB.reviews.length, calendar: calendar, unknownCount: unknownCount,
    accuracy: DB.reviews.length ? Math.round(knownTotal/DB.reviews.length*100) : 0,
    weekTotal: DB.reviews.filter(function(r){ return r.date>=weekStart; }).length,
    todayBatchCount: batch.length, extraWordCount: Math.max(0, batch.length - DB.settings.dailyCount),
    dueCount: due.filter(function(w){ return !reviewedIds[w.id]; }).length,
    nextDueTomorrow: all.filter(function(w){ return w.dueDate===tomorrow; }).length,
    cardMode: DB.settings.cardMode==="cn2jp" ? "cn2jp" : "jp2cn",
    forecast: [1,2,3,4,5,6,7].map(function(n){ var d2=addDays(today,n); return {date:d2, count: all.filter(function(w){ return w.dueDate===d2; }).length}; }),
    boxDistribution: [0,1,2,3,4].map(function(b){ return all.filter(function(w){ return w.box===b; }).length; }),
    todayReviewList: todayReviews.slice().sort(function(a,b){ return a.id-b.id; }).map(function(r){ var w=byId[r.wordId]; return w ? {wordId:w.id, word:w.word, reading:w.reading, meaning:w.meaning, result:r.result} : null; }).filter(Boolean)
  };
}
function reviewWord(wordId, result){
  var w = DB.words.filter(function(x){ return x.id===wordId; })[0];
  if(!w) return;
  var today = todayJST(), newBox, dueDate;
  if(result==="known"){ newBox = Math.min(w.box+1, BOX_INTERVALS.length-1); dueDate = addDays(today, BOX_INTERVALS[newBox]||1); }
  else { newBox = 0; dueDate = addDays(today,1); }
  DB.reviews.push({ id: DB.nextReviewId++, wordId: wordId, result: result, date: today });
  w.box = newBox; w.dueDate = dueDate; saveDB();
}
function undoReview(wordId){
  var w = DB.words.filter(function(x){ return x.id===wordId; })[0];
  if(!w) return false;
  var today = todayJST();
  var mine = DB.reviews.filter(function(r){ return r.wordId===wordId && r.date===today; }).sort(function(a,b){ return b.id-a.id; });
  if(!mine.length) return false;
  var lastId = mine[0].id;
  DB.reviews = DB.reviews.filter(function(r){ return r.id!==lastId; });
  var remaining = DB.reviews.filter(function(r){ return r.wordId===wordId; }).sort(function(a,b){ return a.id-b.id; });
  var box = 0, dueDate = w.batchDate;
  remaining.forEach(function(r){
    if(r.result==="known"){ box = Math.min(box+1, BOX_INTERVALS.length-1); dueDate = addDays(r.date, BOX_INTERVALS[box]||1); }
    else { box = 0; dueDate = addDays(r.date,1); }
  });
  w.box = box; w.dueDate = dueDate; saveDB();
  return true;
}
function saveWordToBook(entry, source){
  var dup = DB.words.filter(function(w){ return w.word===entry.word; })[0];
  if(dup) return dup.id;
  var today = todayJST();
  var id = DB.nextWordId++;
  DB.words.push({ id:id, word:entry.word, reading:entry.reading||"", pos:entry.pos||"", meaning:entry.meaning||"", exampleJp:entry.exampleJp||"", exampleCn:entry.exampleCn||"", mnemonic:entry.mnemonic||null, freqRank:entry.freqRank||null, box:0, dueDate:today, batchDate:today, source:source||"lookup", createdAt:new Date().toISOString() });
  saveDB(); return id;
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function countUp(el, value, suffix){
  if(!el) return;
  var from = 0, start = performance.now(), dur = 650;
  function tick(t){
    var p = Math.min(1,(t-start)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = String(Math.round(from+(value-from)*e)) + (suffix||"");
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function heatmapHtml(st){
  var max = 1; st.calendar.forEach(function(c){ if(c.count>max) max=c.count; });
  var total = st.calendar.reduce(function(s,c){ return s+c.count; },0);
  var weeks = "";
  for(var wi=0; wi<st.calendar.length; wi+=7){
    var cells = "";
    for(var di=0; di<7; di++){
      var day = st.calendar[wi+di]; if(!day) break;
      var bg = day.count===0 ? "var(--surface-2)" : "color-mix(in srgb, var(--jade) "+(30+Math.round(day.count/max*70))+"%, transparent)";
      cells += '<div class="cell anim-cell" title="'+day.date+" · 复习 "+day.count+' 次" style="animation-delay:'+((wi+di)*7)+'ms;background:'+bg+'"></div>';
    }
    weeks += '<div class="wk">'+cells+'</div>';
  }
  var legend = [15,40,65,100].map(function(o){ return '<span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:color-mix(in srgb, var(--jade) '+o+'%, transparent)"></span>'; }).join("");
  return '<div><div style="display:flex;align-items:flex-end;justify-content:space-between"><p style="font-size:.875rem;font-weight:600">打卡日历</p><p style="font-size:.75rem;color:var(--dim)">最近 12 周共复习 '+total+' 次</p></div>'
    + '<div class="heat" style="margin-top:.625rem" role="img" aria-label="最近12周共复习'+total+'次">'+weeks+'</div>'
    + '<div style="margin-top:.5rem;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:10px;color:var(--dim)">少 '+legend+' 多</div></div>';
}
function statsHtml(st){
  if(!st.totalReviews) return "";
  var maxF = 1; st.forecast.forEach(function(f){ if(f.count>maxF) maxF=f.count; });
  var frows = st.forecast.map(function(f,i){
    var d = new Date(f.date+"T00:00:00"); var wk = ["日","一","二","三","四","五","六"][d.getDay()]||"";
    return '<div class="forecast-row"><span style="width:3.5rem;flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--dim)">'+(i===0?"明天":(d.getMonth()+1)+"/"+d.getDate())+" · "+wk+'</span>'
      + '<div class="bar-track"><div class="bar-fill anim-grow-x" style="width:'+Math.round(f.count/maxF*100)+"%;background:"+(f.count>=15?"var(--accent)":"var(--gold)")+';animation-delay:'+(i*70)+'ms"></div></div>'
      + '<span style="width:1.75rem;flex-shrink:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">'+f.count+'</span></div>';
  }).join("");
  var segs = st.boxDistribution.map(function(c,b){
    if(!c) return "";
    var col = b>=3 ? "var(--jade)" : (b===0 ? "var(--accent)" : "var(--gold)");
    return '<div class="anim-grow-x" style="height:100%;width:'+(c/Math.max(1,st.totalWords)*100)+"%;background:"+col+';animation-delay:'+(b*80)+'ms"></div>';
  }).join("");
  var labels = ["新词 / 刚答错","记住了 1 天档","记住了 3 天档","记住了 7 天档","长期记忆 16 天档"].map(function(label,b){
    var col = b>=3 ? "var(--jade)" : (b===0 ? "var(--accent)" : "var(--gold)");
    return '<li style="display:flex;align-items:center;gap:.5rem"><span style="width:10px;height:10px;flex-shrink:0;border-radius:3px;background:'+col+'"></span><span style="flex:1">'+label+'</span><span style="font-weight:600;color:var(--text);font-variant-numeric:tabular-nums">'+(st.boxDistribution[b]||0)+'</span></li>';
  }).join("");
  var fTotal = st.forecast.reduce(function(s,f){ return s+f.count; },0);
  return '<section class="anim-slide-up" style="margin-top:2.25rem" aria-label="学习数据">'
    + '<div class="statgrid">'
    + '<div class="statcell"><p class="num" data-countup="'+st.weekTotal+'">0</p><p class="cap">本周复习</p></div>'
    + '<div class="statcell"><p class="num" style="color:var(--jade)"><span data-countup="'+st.accuracy+'">0</span><span style="font-size:.875rem">%</span></p><p class="cap">累计正确率</p></div>'
    + '<button type="button" class="statcell" id="stat-unknown" aria-label="去词库看错词本"><p class="num" style="color:var(--accent)" data-countup="'+st.unknownCount+'">0</p><p class="cap">错词待攻克 →</p></button>'
    + '</div>'
    + '<div class="cardbox" style="margin-top:.625rem;padding:1rem">'+heatmapHtml(st)+'</div>'
    + (st.totalWords>0 ? '<div class="twocol" style="margin-top:.625rem">'
      + '<div class="cardbox" style="padding:1rem"><div style="display:flex;align-items:flex-end;justify-content:space-between"><p style="font-size:.875rem;font-weight:600">未来 7 天待复习</p><p style="font-size:.75rem;color:var(--dim)">共 '+fTotal+' 个</p></div><div style="margin-top:.75rem;display:grid;gap:.375rem">'+frows+'</div><p style="margin-top:.625rem;font-size:11px;line-height:1.6;color:var(--dim)">哪天量大提前有数：量大的日子可以提前一天多刷一点。</p></div>'
      + '<div class="cardbox" style="padding:1rem"><p style="font-size:.875rem;font-weight:600">掌握分布</p><div style="margin-top:.75rem;display:flex;height:1rem;width:100%;overflow:hidden;border-radius:9999px;background:var(--surface-2)" role="img" aria-label="掌握分布：共 '+st.totalWords+' 个词">'+segs+'</div><ul style="margin-top:.75rem;display:grid;gap:.25rem;font-size:.75rem;color:var(--dim)">'+labels+'</ul></div>'
      + '</div>' : "")
    + '</section>';
}
function fontScale(){ var v = lsGet("vocab-fontsize"); return v==="l" ? 1.2 : v==="s" ? 0.88 : 1; }

      + (w.pos ? '<span class="poschip">'+esc(w.pos)+(w.source==="ai"?" · N1":"")+'</span>' : "")
      + '<p style="font-weight:500;line-height:1.6;font-size:'+Math.round((w.meaning.length>14?24:30)*fs)+'px">'+esc(w.meaning)+'</p>'
      + (w.freqRank===1 ? '<span class="freqtag anim-pop" style="margin-top:1rem">高频必考</span>' : "")
      + '<p class="hint" style="margin-top:1.75rem">先 想 一 想 日 语 怎 么 说</p>'
      + '<p style="margin-top:.5rem;font-size:.75rem;color:var(--ink-dim)">点按卡片看答案</p>'
      + '<div style="margin-top:.75rem">'+boxDots(w.box)+'</div></div>';
  }
  return '<div class="centercol">'
    + (w.pos ? '<span class="poschip">'+esc(w.pos)+(w.source==="ai"?" · N1":"")+'</span>' : "")
    + '<p class="bigword" style="font-size:'+Math.round((w.word.length>5?44:56)*fs)+'px">'+esc(w.word)+'</p>'
    + '<p class="reading" style="margin-top:1rem;font-size:'+(1.25*fs)+'rem">'+esc(w.reading)+'</p>'
    + (w.freqRank===1 ? '<span class="freqtag anim-pop" style="margin-top:1rem">高频必考</span>' : "")
    + '<div style="margin-top:1.25rem">'+speakerBtn(w.word, "朗读单词 "+w.word, 44)+'</div>'
    + '<p class="hint" style="margin-top:1.75rem">点 按 卡 片 看 释 义</p>'
    + '<div style="margin-top:.75rem">'+boxDots(w.box)+'</div></div>';
}

    + '<button type="button" class="iconbtn" data-speak="'+esc(w.word)+'" style="gap:.375rem;border-radius:9999px;padding:.5rem .875rem;font-size:.75rem;font-weight:600;background:var(--paper-dim);color:var(--ink-dim)">'+icon(I.speaker,15)+' 读单词</button>'
    + (w.exampleJp ? '<button type="button" class="iconbtn" data-speak="'+esc(w.exampleJp)+'" style="gap:.375rem;border-radius:9999px;padding:.5rem .875rem;font-size:.75rem;font-weight:600;background:var(--paper-dim);color:var(--ink-dim)">'+icon(I.speaker,15)+' 读例句</button>' : "")
    + '</div></div>'
    + '<div style="margin-top:1.25rem;border-top:1px dashed var(--paper-dim);padding-top:1rem"><p style="font-size:1.125rem;font-weight:500;line-height:1.65">'+esc(w.meaning)+'</p></div>'
    + (w.exampleJp ? '<div style="margin-top:1rem;border-radius:.75rem;padding:1rem;background:var(--paper-dim)"><p class="mincho" style="font-size:1rem;line-height:1.65">'+esc(w.exampleJp)+'</p>'+(w.exampleCn?'<p style="margin-top:.375rem;font-size:.875rem;color:var(--ink-dim)">'+esc(w.exampleCn)+'</p>':"")+'</div>' : "")
    + '<div style="margin-top:1rem;flex:1">'+mn+'</div>'

  h += statsHtml(st);

  }
  h += '<div class="anim-slide-up" style="margin:1.75rem auto 0;max-width:24rem;border-radius:1.5rem;padding:1.25rem;text-align:center;background:var(--surface);border:1px solid var(--border)">'
    + '<p class="mincho" style="display:flex;align-items:center;justify-content:center;gap:.375rem;font-size:1.125rem;font-weight:700">'+icon(I.sparkle,19)+' 还想再学新的？</p>'
    + '<p style="margin-top:.375rem;font-size:.75rem;line-height:1.65;color:var(--dim)">今日目标已经完成。再来一组全新的 N1 词，不影响明天的计划，新词同样会按 1 / 3 / 7 / 16 天的节奏回来复习。可以反复加组。</p>';
  if(!st.batchExists){
    h += '<button type="button" id="gen-btn2" class="btn btn-accent" style="margin-top:1rem;width:100%;padding:.875rem 0" '+(studyUI.busy?"disabled":"")+'>'+(studyUI.busy?"AI 正在出词…":"生成今日 "+st.dailyCount+" 个新词")+'</button>'
      + (studyUI.genError ? '<p style="margin-top:.75rem;font-size:.875rem;color:var(--accent)">'+esc(studyUI.genError)+'</p>' : "");
  } else if(st.hasKey){
    if(studyUI.busy) h += '<div style="position:relative;height:120px;margin-top:1rem" aria-hidden="true">'+[0,1,2].map(function(i){ return '<div class="gen-fly-card" style="--fx:'+(i%2?90:-90)+'px;--fr:'+(i%2?14:-14)+'deg;--fr2:'+((i-1)*2)+'deg;animation-delay:'+(i*140)+'ms;z-index:'+(3-i)+'"><span class="mincho" style="font-size:1.375rem;font-weight:600">'+["新しい","単語","到着"][i]+'</span></div>'; }).join("")+'</div>';
    h += '<button type="button" id="extra-btn" class="btn btn-grad" style="margin-top:1rem;width:100%;padding:.875rem 0" '+(studyUI.busy?"disabled":"")+'>'+icon(I.plus,18)+(studyUI.busy?" AI 正在出新词，稍等…":" 再学一组 · +"+st.dailyCount+" 个新词")+'</button>'
      + '<p style="margin-top:.625rem;font-size:11px;color:var(--dim)">学完这一组，还能继续点，再来下一组</p>'
      + (studyUI.extraError ? '<p style="margin-top:.75rem;font-size:.875rem;color:var(--accent)" role="alert">'+esc(studyUI.extraError)+'</p>' : "");
  } else {
    h += '<p style="margin-top:.75rem;font-size:.875rem;color:var(--dim)">先去设置里填上 DeepSeek API Key，就能继续生成新词。</p><button type="button" id="go-settings2" class="btn btn-accent" style="margin-top:.75rem;width:100%;padding:.75rem 0">去设置 API Key</button>';

<script>
"use strict";
/* ---------- swipe card mounting ---------- */
function mountCard(wrap, w, depth, mode){
  var isTop = depth===0;
  wrap.innerHTML = '<div class="flip-persp"><div class="flip-inner">'
    + '<div class="face front"></div>'
    + '<div class="face back no-scrollbar"></div>'
    + '</div></div>';
  var front = wrap.querySelector(".front"), back = wrap.querySelector(".back");
  front.innerHTML = '<div class="glowedge" data-glow="no" style="left:0;width:7.5rem;background:linear-gradient(90deg,rgba(217,57,46,.55),rgba(217,57,46,.12) 55%,transparent);opacity:0;filter:blur(1px)"></div>'
    + '<div class="glowedge" data-glow="yes" style="right:0;width:7.5rem;background:linear-gradient(-90deg,rgba(31,160,95,.55),rgba(31,160,95,.12) 55%,transparent);opacity:0;filter:blur(1px)"></div>'
    + '<div class="stamp no" data-stamp="no" style="display:none">不认识</div>'
    + '<div class="stamp yes" data-stamp="yes" style="display:none">认识</div>'
    + cardFaceFront(w, mode);
  back.innerHTML = cardFaceBack(w);
  var inner = wrap.querySelector(".flip-inner");
  if(!isTop){
    // Stack depth: cards behind peek out below with scale + slight rotation
    var rot = depth===1 ? 1.6 : -2.4;
    wrap.style.transform = "translateY("+(depth*15)+"px) scale("+(1-depth*0.05)+") rotate("+rot+"deg)";
    wrap.style.transformOrigin = "50% 100%";
    wrap.style.filter = "brightness("+(1-depth*0.06)+") saturate("+(1-depth*0.12)+")";
    wrap.style.opacity = String(1-depth*0.12);
    wrap.style.pointerEvents = "none";
    var peekFace = wrap.querySelector(".face.front");
    if(peekFace) peekFace.style.boxShadow = "0 8px 22px rgba(20,24,40,.14)";
    return;
  }
  if(studyUI.advanced){ wrap.classList.add("deck-spring"); }
  if(studyUI.flyIn){ wrap.classList.add("card-fly-in"); wrap.style.setProperty("--fx", (depth%2? -90:90)+"px"); wrap.style.setProperty("--fr", (depth%2? -14:14)+"deg"); wrap.style.animationDelay = (depth*90)+"ms"; }
  wrap.classList.add("swipe-card");
  var drag = {x:0,y:0}, snapping=false, leaving=null, flipped=false;
  var pointer = null, touchTrack = null, flippedRef = {v:false};
  var timer = null;
  function applyTransform(){
    if(leaving){
      wrap.style.transform = "translateX("+(leaving==="known"?"130vw":"-130vw")+") rotate("+(leaving==="known"?16:-16)+"deg)";
      wrap.style.transition = "transform .32s cubic-bezier(.22,.9,.3,1)";
      return;
    }
    var rot = drag.x/16;
    var tiltY = Math.max(-14, Math.min(14, drag.x/14));
    var tiltX = Math.max(-10, Math.min(10, -drag.y/18));
    wrap.style.transform = "perspective(1100px) translate("+drag.x+"px, "+(drag.y*0.35)+"px) rotateY("+tiltY+"deg) rotateX("+tiltX+"deg) rotate("+rot+"deg)";
    wrap.style.transition = snapping ? "transform .55s cubic-bezier(.2,1.55,.35,1)" : "none";
    var kg = Math.max(0, Math.min(1, drag.x/110)), ug = Math.max(0, Math.min(1, -drag.x/110));
    front.style.boxShadow = kg>0 ? "0 0 0 3px rgba(47,158,110,"+(0.4+kg*0.5)+"), 0 0 "+(18+kg*34)+"px rgba(47,158,110,"+(kg*0.55)+"), var(--card-shadow)" : ug>0 ? "0 0 0 3px rgba(226,72,61,"+(0.4+ug*0.5)+"), 0 0 "+(18+ug*34)+"px rgba(226,72,61,"+(ug*0.55)+"), var(--card-shadow)" : "var(--card-shadow)";
    wrap.querySelector('[data-glow="yes"]').style.opacity = kg;
    wrap.querySelector('[data-glow="no"]').style.opacity = ug;
    var sNo = wrap.querySelector('[data-stamp="no"]'), sYes = wrap.querySelector('[data-stamp="yes"]');
    sNo.style.display = drag.x<-28 ? "block" : "none"; sNo.style.opacity = ug;
    sYes.style.display = drag.x>28 ? "block" : "none"; sYes.style.opacity = kg;
  }
  function flyOut(dir){
    if(leaving) return;
    leaving = dir; applyTransform();
    timer = setTimeout(function(){ onCardSwipe(w, dir); }, 300);
  }
  wrap._flyOut = flyOut;
  // Native non-passive touchmove: stops iOS Safari from stealing the
  // horizontal gesture for page panning (same fix as the Muse version).
  wrap.addEventListener("touchstart", function(e){
    var t = e.touches[0]; if(!t) return;
    touchTrack = {sx:t.clientX, sy:t.clientY, lock:null};
  }, {passive:true});
  wrap.addEventListener("touchmove", function(e){
    var t = e.touches[0]; if(!touchTrack || !t) return;
    var dx = t.clientX-touchTrack.sx, dy = t.clientY-touchTrack.sy;
    if(!touchTrack.lock && Math.max(Math.abs(dx),Math.abs(dy))>8) touchTrack.lock = Math.abs(dx)>=Math.abs(dy) ? "x" : "y";
    if(touchTrack.lock==="x" || !flippedRef.v) e.preventDefault();
  }, {passive:false});
  function endTouch(){ touchTrack = null; }
  wrap.addEventListener("touchend", endTouch); wrap.addEventListener("touchcancel", endTouch);
  wrap.addEventListener("pointerdown", function(e){
    if(e.target.closest("button, a, input, select, textarea")) return;
    pointer = {id:e.pointerId, sx:e.clientX, sy:e.clientY, moved:false, samples:[{t:performance.now(), x:e.clientX}]};
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
    snapping = false;
  });
  wrap.addEventListener("pointermove", function(e){
    if(!pointer || pointer.id!==e.pointerId) return;
    var dx = e.clientX-pointer.sx, dy = e.clientY-pointer.sy;
    if(Math.abs(dx)+Math.abs(dy)>6) pointer.moved = true;
    if(pointer.moved){
      pointer.samples.push({t:performance.now(), x:e.clientX});
      if(pointer.samples.length>6) pointer.samples.shift();
      drag = {x:dx, y:dy}; applyTransform();
    }
  });
  function up(e){
    if(!pointer || pointer.id!==e.pointerId) return;
    var p = pointer; pointer = null;
    if(!p.moved){
      flipped = !flipped; flippedRef.v = flipped;
      inner.style.transform = "rotateY("+(flipped?180:0)+"deg)";
      return;
    }
    var now = performance.now();
    var recent = p.samples.filter(function(s){ return now-s.t<=110; });
    var first = recent[0];
    var vx = first && now>first.t ? (e.clientX-first.x)/(now-first.t) : 0;
    if(drag.x>105 || (drag.x>42 && vx>0.55)) flyOut("known");
    else if(drag.x<-105 || (drag.x<-42 && vx<-0.55)) flyOut("unknown");
    else { snapping = true; drag = {x:0,y:0}; applyTransform(); }
  }
  wrap.addEventListener("pointerup", up);
  wrap.addEventListener("pointercancel", function(){
    pointer = null; snapping = true; drag = {x:0,y:0}; applyTransform();
  });
  bindSpeakers(wrap);
  Array.prototype.forEach.call(wrap.querySelectorAll("[data-genmn],[data-regen]"), function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      var regen = b.hasAttribute("data-regen");
      var errEl = back.querySelector('[data-mnerr="'+w.id+'"]');
      b.disabled = true;
      var label = b.querySelector("span"); if(label) label.textContent = "想着呢…";
      aiMnemonic(w, regen).then(function(){
        back.innerHTML = cardFaceBack(w); bindSpeakers(back); rebindMnemonic(back, w, inner, function(v){ flippedRef.v=v; });
      }).catch(function(err){
        b.disabled = false; if(label) label.textContent = regen ? "换一个" : "AI 助记";
        if(errEl) errEl.textContent = err && err.message ? err.message : "生成失败，请重试。";
      });
    });
  });
}
function rebindMnemonic(back, w, inner, setFlipped){
  Array.prototype.forEach.call(back.querySelectorAll("[data-genmn],[data-regen]"), function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      var regen = b.hasAttribute("data-regen");
      b.disabled = true;
      aiMnemonic(w, regen).then(function(){
        back.innerHTML = cardFaceBack(w); bindSpeakers(back); rebindMnemonic(back, w, inner, setFlipped);
      }).catch(function(err){
        b.disabled = false;
        var errEl = back.querySelector('[data-mnerr="'+w.id+'"]');
        if(errEl) errEl.textContent = err && err.message ? err.message : "生成失败，请重试。";
      });
    });
  });
}
function onCardSwipe(w, result){
  buzz(result==="known" ? 12 : [16,40,16]);
  studyUI.advanced = true;
  studyUI.lastResult = {word:w.word, r:result};
  studyUI.undoable = {wordId:w.id, word:w.word};
  reviewWord(w.id, result);
  render();
}
function afterStudyRender(st){
  // count-ups
  Array.prototype.forEach.call(view.querySelectorAll("[data-countup]"), function(el){
    countUp(el, parseInt(el.getAttribute("data-countup"),10)||0);
  });
  var unk = document.getElementById("stat-unknown");
  if(unk) unk.addEventListener("click", function(){ wordsUI.filter="unknown"; TAB="words"; render(); window.scrollTo(0,0); });
  var ms = document.getElementById("ms-close");
  if(ms) ms.addEventListener("click", function(){ studyUI.milestoneSeen = true; render(); });
  var ig = document.getElementById("install-go");
  if(ig) ig.addEventListener("click", function(){ TAB="settings"; render(); window.scrollTo(0,0); setTimeout(function(){ var el=document.getElementById("install-section"); if(el) el.scrollIntoView({behavior:"smooth"}); }, 60); });
  var ix = document.getElementById("install-x");
  if(ix) ix.addEventListener("click", function(){ lsSet("vocab-install-dismissed","1"); render(); });
  Array.prototype.forEach.call(view.querySelectorAll("[data-mode]"), function(b){
    b.addEventListener("click", function(){
      var m = b.getAttribute("data-mode");
      if(m!==DB.settings.cardMode){ DB.settings.cardMode = m; saveDB(); render(); }
    });
  });
  var as = document.getElementById("autospeak");
  if(as) as.addEventListener("click", function(){
    studyUI.autoSpeak = !studyUI.autoSpeak;
    lsSet("vocab-autospeak", studyUI.autoSpeak ? "1" : "0");
    render();
  });
  // mount deck
  var deck = document.getElementById("deck");
  if(deck && st.queue.length){
    var wraps = deck.querySelectorAll(".swipe-wrap");
    for(var i=0;i<wraps.length;i++){
      var wid = parseInt(wraps[i].getAttribute("data-wid"),10);
      var w = st.queue.filter(function(x){ return x.id===wid; })[0];
      if(w) mountCard(wraps[i], w, i, st.cardMode);
    }
    var top = st.queue[0];
    if(studyUI.autoSpeak && st.cardMode==="jp2cn" && top && studyUI.lastSpokenId!==top.id){
      studyUI.lastSpokenId = top.id;
      setTimeout(function(){ speakJa(top.word); }, 300);
    }
    var bk = document.getElementById("btn-known"), bu = document.getElementById("btn-unknown");
    if(bk) bk.addEventListener("click", function(){ var t=deck.querySelector('[data-depth="0"]'); if(t && t._flyOut) t._flyOut("known"); });
    if(bu) bu.addEventListener("click", function(){ var t=deck.querySelector('[data-depth="0"]'); if(t && t._flyOut) t._flyOut("unknown"); });
    studyUI.advanced = false; studyUI.flyIn = false;
  }
  var undo = document.getElementById("undo-btn");
  if(undo && studyUI.undoable) undo.addEventListener("click", function(){
    if(undoReview(studyUI.undoable.wordId)){ studyUI.undoable=null; studyUI.lastResult=null; }
    render();
  });
  function bindGen(id, extra){
    var b = document.getElementById(id); if(!b) return;
    b.addEventListener("click", function(){
      if(studyUI.busy) return;
      studyUI.busy = true; studyUI.genError = null; studyUI.extraError = null; render();
      generateWords(st.dailyCount).then(function(n){
        studyUI.busy = false; studyUI.flyIn = true;
        if(extra) studyUI.extraNotice = "已为你多准备 "+n+" 个新词，继续刷吧！";
        studyUI.lastResult = null; studyUI.undoable = null;
        render();
      }).catch(function(e){
        studyUI.busy = false;
        if(extra) studyUI.extraError = e && e.message ? e.message : "生成失败，请重试。";
        else studyUI.genError = e && e.message ? e.message : "生成失败，请重试。";
        render();
      });
    });
  }
  bindGen("gen-btn", false); bindGen("gen-btn2", false); bindGen("extra-btn", true);
  var gs = document.getElementById("go-settings"); if(gs) gs.addEventListener("click", function(){ TAB="settings"; render(); window.scrollTo(0,0); });
  var gs2 = document.getElementById("go-settings2"); if(gs2) gs2.addEventListener("click", function(){ TAB="settings"; render(); window.scrollTo(0,0); });
  var dq = document.getElementById("done-quiz"); if(dq) dq.addEventListener("click", function(){ TAB="quiz"; render(); window.scrollTo(0,0); });
}
/* keyboard swipe (desktop) */
document.addEventListener("keydown", function(e){
  if(TAB!=="study") return;
  var t = e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT")) return;
  var deck = document.getElementById("deck"); if(!deck) return;
  var top = deck.querySelector('[data-depth="0"]'); if(!top || !top._flyOut) return;
  if(e.key==="ArrowRight") top._flyOut("known");
  else if(e.key==="ArrowLeft") top._flyOut("unknown");
});
/* daily reminder (same behaviour as the Muse version) */
var reminderCheckedFor = "";
function checkReminder(st){
  try{
    if(lsGet("vocab-reminder-enabled")!=="1") return;
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    var time = lsGet("vocab-reminder-time") || "20:00";
    var now = new Date();
    var hm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
    if(hm < time) return;
    if(reminderCheckedFor===st.today) return;
    reminderCheckedFor = st.today;
    var sentKey = "vocab-reminder-sent-"+st.today;
    if(lsGet(sentKey)) return;
    var pending = st.queue.length;
    var streakRisk = st.streak>0 && st.reviewedToday===0;
    if(pending<=0 && !streakRisk){ lsSet(sentKey,"1"); return; }
    var parts = [];
    if(pending>0) parts.push("今天还有 "+pending+" 张卡没刷");
    if(st.dueCount>0) parts.push("其中 "+st.dueCount+" 个是到期复习词");
    if(streakRisk) parts.push("连续学习 "+st.streak+" 天别断在今天");
    new Notification("日语背词卡 · 该复习啦", { body: parts.join("，")+"。" });
    lsSet(sentKey,"1");
  }catch(e){}
}
setInterval(function(){ if(TAB==="study") checkReminder(computeState()); }, 60000);
</script>
<script>
"use strict";
/* ---------- quiz view ---------- */
var quizUI = { mode:null, count:10, questions:null, error:null, idx:0, picked:null, answers:[], busy:false };
function buildQuiz(count, mode){
  var all = DB.words.slice();
  if(all.length<4) return {ok:false, error:"词库里至少要有 4 个词才能出测验题。先去学习页生成或添加一些词吧。", questions:[]};
  var latest = {};
  DB.reviews.slice().sort(function(a,b){ return a.id-b.id; }).forEach(function(r){ latest[r.wordId]=r.result; });
  var pool = shuffle(all).sort(function(a,b){
    var pa = latest[a.id]==="unknown"?0:1, pb = latest[b.id]==="unknown"?0:1;
    return (pa-pb) || (a.box-b.box);
  });
  var targets = pool.slice(0, Math.min(count, pool.length));
  var questions = targets.map(function(t){
    var correct = mode==="cn2jp" ? t.word : t.meaning;
    var seen = {}; seen[correct]=1; var distractors = [];
    var others = shuffle(all.filter(function(x){ return x.id!==t.id; }));
    for(var i=0;i<others.length && distractors.length<3;i++){
      var text = mode==="cn2jp" ? others[i].word : others[i].meaning;
      if(!text || seen[text]) continue; seen[text]=1; distractors.push(text);
    }
    var options = shuffle([correct].concat(distractors));
    return { wordId:t.id, word:t.word, reading:t.reading, pos:t.pos, meaning:t.meaning, exampleJp:t.exampleJp, exampleCn:t.exampleCn, options:options, correctIndex:options.indexOf(correct) };
  });
  return {ok:true, error:null, questions:questions};
}
function renderQuiz(st){
  if(quizUI.mode===null) quizUI.mode = st.cardMode;
  var mode = quizUI.mode, qs = quizUI.questions;
  var h = '<div class="anim-rise"><h2 class="mincho" style="font-size:1.5rem;font-weight:700">四选一测验</h2><p style="margin-top:.25rem;font-size:.875rem;color:var(--dim)">从你的词库出题，错词和还没记牢的词优先。测验只是练手感，不影响卡片的复习节奏。</p>';
  if(qs===null){
    h += '<div class="anim-slide-up" style="margin-top:1.5rem;border-radius:1.5rem;padding:1.25rem;background:var(--surface);border:1px solid var(--border)">'
      + '<p style="font-size:.875rem;font-weight:600">出题方向</p><div class="seg" style="margin-top:.5rem;background:var(--bg)" role="group" aria-label="测验出题方向">'
      + '<button type="button" data-qmode="jp2cn" aria-pressed="'+(mode==="jp2cn")+'" class="'+(mode==="jp2cn"?"on":"")+'">看日语选中文</button>'
      + '<button type="button" data-qmode="cn2jp" aria-pressed="'+(mode==="cn2jp")+'" class="'+(mode==="cn2jp"?"on":"")+'">看中文选日语</button></div>'
      + '<p style="margin-top:1rem;font-size:.875rem;font-weight:600">题目数量</p><div style="margin-top:.5rem;display:flex;gap:.5rem" role="group" aria-label="测验题目数量">'
      + [5,10,20].map(function(c){ return '<button type="button" data-qcount="'+c+'" aria-pressed="'+(quizUI.count===c)+'" style="flex:1;border-radius:.75rem;padding:.625rem 0;font-size:.875rem;font-weight:700;background:'+(quizUI.count===c?"var(--accent)":"var(--bg)")+';color:'+(quizUI.count===c?"#fff":"var(--dim)")+';border:1px solid var(--border)">'+c+' 题</button>'; }).join("")
      + '</div>'
      + '<button type="button" id="quiz-start" class="btn btn-grad" style="margin-top:1.25rem;width:100%;padding:.875rem 0">'+icon(I.target,18)+' 开始测验</button>'
      + (quizUI.error ? '<div style="margin-top:1rem;text-align:center"><p style="font-size:.875rem;color:var(--accent)" role="alert">'+esc(quizUI.error)+'</p><button type="button" id="quiz-gostudy" class="btn btn-accent" style="margin-top:.75rem;display:inline-flex;padding:.625rem 1.5rem;font-size:.875rem">去学习页加词</button></div>' : "")
      + '</div>';
  } else if(quizUI.idx >= qs.length){
    var score = quizUI.answers.filter(Boolean).length;

  var same = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
